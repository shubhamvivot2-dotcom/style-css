<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text on Image</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
.container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.6;
    display: block;
}
        .name {
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            color: red;
            white-space: nowrap;
        }

        /* Top row */
        .top-left {
            top: 8px;
            left: 16px;
        }

        .top-center {
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .top-right {
            top: 8px;
            right: 16px;
        }

        /* Middle row */
        .middle-left {
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
        }

        .center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .middle-right {
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
        }

        /* Bottom row */
        .bottom-left {
            bottom: 8px;
            left: 16px;
        }

        .bottom-center {
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .bottom-right {
            bottom: 8px;
            right: 16px;
        }

        @media (max-width: 850px) {
            .container {
                width: 95%;
                height: 350px;
            }

            .name {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <img src="Passport Photo shubham  copy 2.jpeg"
             alt="My photo">

        <div class="name top-left">Shubham MEHTA</div>
        <div class="name top-center">Shubham Mehta</div>
        <div class="name top-right">Shubham Mehta</div>

        <div class="name middle-left">Shubham Mehta</div>
        <div class="name center">Shubham Mehta</div>
        <div class="name middle-right">Shubham Mehta</div>

        <div class="name bottom-left">Shubham Mehta</div>
        <div class="name bottom-center">Shubham Mehta</div>
        <div class="name bottom-right">Shubham Mehta</div>
    </div>

</body>
</html>
