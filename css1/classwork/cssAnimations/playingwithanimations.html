<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background-color:  #00F5A0;  /* fallback for old browsers */
background: -webkit-linear-gradient(to right, #00D9F5, #00F5A0);  /* Chrome 10-25, Safari 5.1-6 */
background: linear-gradient(to right, #00D9F5, #00F5A0); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */

  position: relative;
  border-radius: 50%;
  text-align: center;
  justify-content: center;
  animation-name: myAnimation;
  animation-duration: 10s;
  
}

@keyframes myAnimation {
  0%   {background: #f79d00;  
background: -webkit-linear-gradient(to right, #64f38c, #f79d00); 
background: linear-gradient(to right, #64f38c, #f79d00);left:0px; top:0px;}
  25%  {background: #00fff0;
background: -webkit-linear-gradient(to right, #0083fe, #00fff0);  
background: linear-gradient(to right, #0083fe, #00fff0); left:200px; top:0px;}
  50%  {background: #11998e;  
background: -webkit-linear-gradient(to right, #38ef7d, #11998e);  
background: linear-gradient(to right, #38ef7d, #11998e);
; left:200px; top:200px;}
  75%  {background: #9CECFB;  
background: -webkit-linear-gradient(to right, #0052D4, #65C7F7, #9CECFB);  
background: linear-gradient(to right, #0052D4, #65C7F7, #9CECFB); 
; left:0px; top:200px;}
  100% {background: #16A085;  
background: -webkit-linear-gradient(to right, #F4D03F, #16A085);  
background: linear-gradient(to right, #F4D03F, #16A085); 
; left:0px; top:0px;}
}
</style>
</head>
<body>

<h1></h1>

<div>CSS <br> Animation</div>



</body>
</html>
