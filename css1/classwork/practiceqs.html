<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Mobile first (less than 600px): 1 column */
        .grid-container {
            width: 100%;
            padding: 16px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            aspect-ratio: 4 / 5;
            border: 1px solid #ccc;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

    
        @media (min-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .card {
                max-width: none;
                margin: 0;
            }
        }

        
        @media (min-width: 769px) {
            .grid-container {
                width: 100%;
                max-width: 1200px;
                margin: 0 auto;
                padding: 24px;
                gap: 24px;
                grid-template-columns: repeat(3, 1fr);
            }

            .card {
                width: 100%;
                max-width: 400px;
                height: auto;
                aspect-ratio: 1 / 1;
            }
        }
    </style>
</head>
<body>
    <div class="grid-container">
       <div class="card">
            <img src="WhatsApp Image 2026-11-26 at 9.39.37 AM.jpeg" alt="Navy Blazer Studio">
        </div>
        <div class="card">
            <img src="formal_1.jpg" alt="Charcoal Three-Piece Suit Office">
        </div>
        <div class="card">
            <img src="formal_2.jpg" alt="Black Tuxedo Library">
        </div>
        <div class="card">
            <img src="formal_3.jpg" alt="Beige Blazer Courtyard">
        </div>
        <div class="card">
            <img src="formal_4.jpg" alt="Burgundy Blazer Studio">
        </div>
        <div class="card">
            <img src="formal_5.jpg" alt="Olive Suit Architectural Interior">
        </div>
        <div class="card">
            <img src="formal_6.jpg" alt="Black Bandhgala Heritage Courtyard">
        </div>
        <div class="card">
            <img src="formal_7.jpg" alt="Brown Pinstripe Suit Boardroom">
        </div>
        <div class="card">
            <img src="desi_khet.jpg" alt="Desi Gaon Khet Look">
        </div>

    </div>
</body>
</html>
