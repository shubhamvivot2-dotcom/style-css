<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            width:100vw;
            height:100vh;
            margin: 25px;
            gap:100px;
            display: grid;
            justify-content: center;
            grid-template-columns: repeat(3, 1fr);}
            .card{
             width: 400px;
                height: 400px;

                border: 1px solid #ccc;
            }
            .card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            @media (max-width: 768px) {
                .grid-container {
                    width: 100%;
                    height: auto;
                    margin: 0;
                    padding: 16px;
                    box-sizing: border-box;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 16px;
                }

                .card {
                    width: 100%;
                    height: auto;
                    aspect-ratio: 4 / 5;
                }
            }

            @media (max-width: 600px) {
                .grid-container {
                    grid-template-columns: 1fr;
                }

                .card {
                    max-width: 400px;
                    margin: 0 auto;
                }
            }
    </style>
</head>
<body>
    <div class="grid-container" ;">
       <div class="card">
            <img src="WhatsApp Image 2026-11-26 at 9.39.37 AM.jpeg" alt="Navy Blazer Studio">
        </div>
        <div class="card">
            <img src="formal_1.jpg" alt="Charcoal Three-Piece Suit Office">
        </div>
        <div class="card">
            <img src="formal_2.jpg" alt="Black Tuxedo Library">
        </div>
        <div class="card">
            <img src="formal_3.jpg" alt="Beige Blazer Courtyard">
        </div>
        <div class="card">
            <img src="formal_4.jpg" alt="Burgundy Blazer Studio">
        </div>
        <div class="card">
            <img src="formal_5.jpg" alt="Olive Suit Architectural Interior">
        </div>
        <div class="card">
            <img src="formal_6.jpg" alt="Black Bandhgala Heritage Courtyard">
        </div>
        <div class="card">
            <img src="formal_7.jpg" alt="Brown Pinstripe Suit Boardroom">
        </div>
        <div class="card">
            <img src="desi_khet.jpg" alt="Desi Gaon Khet Look">
        </div>

    </div>
</body>
</html>
