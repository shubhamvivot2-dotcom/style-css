<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>

    img {
  position: absolute;
  left: 0px;
  top: 0px;
  z-index: -1;
}
</style>
</head>
<body>

<h1>This is a heading</h1>
<img src="https://media.istockphoto.com/id/1142576725/photo/lonely-japanese-cherry-sakura-with-pink-flowers-in-spring-time-on-green-meadow.jpg?s=612x612&w=0&k=20&c=iAtQqowRmIhIxZS7YslEh4kP7fS_8NCxtCPhtcXYYDg=" alt="pink trees">
<p>Because the image has a z-index of -1, it will be placed behind the text.</p>

</body>
</html>
